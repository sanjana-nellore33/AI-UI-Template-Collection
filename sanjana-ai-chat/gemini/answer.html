<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gemini - Response</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="gemini-logo">✦</div>
                <span>Gemini</span>
            </div>

            <button
                class="close-btn"
                onclick="toggleSidebar()">
                ×
            </button>

        </div>


        <button
            class="new-chat"
            onclick="location.href='index.html'">

            ＋ New chat

        </button>


        <div
            class="history"
            id="history">

            <p class="history-title">
                Recent
            </p>

        </div>


        <div class="sidebar-bottom">

            <div class="side-item">
                ✨ Explore Gemini
            </div>

            <div class="side-item">
                ⚙ Settings
            </div>

            <div class="side-item">
                ❓ Help
            </div>

        </div>

    </aside>


    <!-- MOBILE OVERLAY -->
    <div
        class="overlay"
        id="overlay"
        onclick="toggleSidebar()">
    </div>


    <!-- MAIN AREA -->
    <main class="main-area">


        <!-- TOP BAR -->
        <header class="topbar">

            <div class="top-left">

                <button
                    class="menu-btn"
                    onclick="toggleSidebar()">

                    ☰

                </button>


                <div class="model-name">

                    Gemini
                    <span>⌄</span>

                </div>

            </div>


            <button
                class="profile-button"
                onclick="location.href='upgrade.html'">

                Upgrade

            </button>

        </header>



        <!-- ANSWER CONTENT -->
        <section class="answer-content">


            <!-- HEADER -->
            <div class="answer-header">

                <div class="large-gemini-logo">
                    ✦
                </div>

                <h1>
                    Gemini Response
                </h1>

                <p>
                    Your conversation with Gemini
                </p>

            </div>



            <!-- CONVERSATION -->
            <div class="conversation">


                <!-- USER PROMPT -->
                <div class="prompt-card">

                    <div class="card-label">
                        You
                    </div>

                    <div
                        class="prompt-text"
                        id="selectedPrompt">

                        Your prompt will appear here.

                    </div>

                </div>



                <!-- GEMINI RESPONSE -->
                <div class="response-card">

                    <div class="card-label">
                        ✦ Gemini
                    </div>


                    <div
                        class="response-text"
                        id="selectedAnswer">

                        Your Gemini response will appear here.

                    </div>



                    <!-- RESPONSE ACTIONS -->
                    <div class="response-actions">

                        <button
                            onclick="likeResponse()">

                            👍

                        </button>


                        <button
                            onclick="dislikeResponse()">

                            👎

                        </button>


                        <button
                            onclick="shareResponse()">

                            ↗ Share

                        </button>


                        <button
                            onclick="copyResponse()">

                            ⧉ Copy

                        </button>

                    </div>

                </div>

            </div>



            <!-- FOLLOW-UP -->
            <div class="another-prompt">

                <input
                    type="text"
                    id="answerInput"
                    placeholder="Ask Gemini a follow-up..."
                    onkeydown="handleAnswerEnter(event)"
                >


                <button
                    onclick="sendAnswerPrompt()">

                    ➤

                </button>

            </div>


        </section>

    </main>

</div>


<!-- ONLY ONE SCRIPT -->
<script src="script.js"></script>

</body>

</html>
