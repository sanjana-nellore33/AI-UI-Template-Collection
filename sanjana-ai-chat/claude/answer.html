<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - Conversation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-icon">C</div>
            <span>Claude</span>
        </div>

        <button class="new-chat" onclick="createNewChat()">
            <span>＋</span> New chat
        </button>

        <div class="sidebar-title">Recent</div>

        <div id="historyList" class="history-list"></div>

        <div class="sidebar-bottom">
            <button onclick="showMessage('Settings')">⚙ <span>Settings</span></button>
            <button onclick="showMessage('Help & Support')">❓ <span>Help</span></button>
            <button onclick="showMessage('Account')">👤 <span>Account</span></button>
        </div>

    </aside>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <main class="main">

        <header class="topbar">

            <button class="menu-btn" onclick="toggleSidebar()">☰</button>

            <div class="page-title">
                <span>Claude</span>
            </div>

            <button class="upgrade-btn" onclick="openUpgrade()">
                Upgrade
            </button>

        </header>

        <section class="conversation">

            <div class="conversation-header">
                <div class="claude-logo small">✦</div>

                <div>
                    <h2>Claude</h2>
                    <p>AI assistant</p>
                </div>
            </div>

            <div id="conversationMessages"></div>

            <div class="followup-composer">

                <textarea
                    id="followupInput"
                    placeholder="Message Claude..."
                    rows="1"
                ></textarea>

                <button onclick="sendFollowUp()">↑</button>

            </div>

            <p class="bottom-disclaimer">
                Claude can make mistakes. Check important information.
            </p>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
